; Paradox MG/SP serial bridge for the LilyGO TTGO T-Display (ESP32 + ST7789 135x240)
; (also runs on other ESP32 boards with the display turned off in Settings)

[env:ttgo-t-display]
platform = espressif32 @ 6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
upload_port = COM3
monitor_port = COM3

; Two 1.9 MB app slots (OTA kept) instead of 1.25 MB - needed for HomeKit (HomeSpan).
; NVS (settings) sits at the same place as in the default layout, so settings survive.
; Changing the partition table needs one USB upload; OTA works again afterwards.
board_build.partitions = min_spiffs.csv

lib_deps =
  bodmer/TFT_eSPI @ 2.5.43
  bblanchon/ArduinoJson @ 7.2.1
  knolleary/PubSubClient @ 2.8
  homespan/HomeSpan @ 1.9.1
; QR codes: ricmoo/QRCode (MIT) is vendored as src/qrgen.* - its "qrcode.h" clashes with ESP-IDF's.

; TFT_eSPI configuration for the T-Display (equivalent to its Setup25_TTGO_T_Display.h)
build_flags =
  -DUSER_SETUP_LOADED=1
  -DDISABLE_ALL_LIBRARY_WARNINGS=1
  -DST7789_DRIVER=1
  -DTFT_WIDTH=135
  -DTFT_HEIGHT=240
  -DCGRAM_OFFSET=1
  -DTFT_MOSI=19
  -DTFT_SCLK=18
  -DTFT_CS=5
  -DTFT_DC=16
  -DTFT_RST=23
  -DTFT_BL=4
  -DTFT_BACKLIGHT_ON=HIGH
  -DLOAD_GLCD=1
  -DLOAD_FONT2=1
  -DLOAD_FONT4=1
  -DSPI_FREQUENCY=40000000
  -DSPI_READ_FREQUENCY=6000000

; Any other ESP32 board (no screen): same firmware, display off by default (can be
; switched on in Settings -> System). Upload: python -m platformio run -e esp32-generic -t upload
[env:esp32-generic]
extends = env:ttgo-t-display
upload_port = COM4
monitor_port = COM4
build_flags =
  ${env:ttgo-t-display.build_flags}
  -DDISPLAY_ENABLED=0

; Network upload (ArduinoOTA). Set the bridge's web password first, e.g. in PowerShell:
;   $env:PARADOX_OTA_PASSWORD = "your-web-password"
;   python -m platformio run -e ota -t upload
[env:ota]
extends = env:ttgo-t-display
upload_protocol = espota
upload_port = paradox.local
upload_flags =
  --port=3232
  --auth=${sysenv.PARADOX_OTA_PASSWORD}
